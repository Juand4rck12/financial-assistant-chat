[project]
name = "financial-assistant-chat"
version = "0.1.0"
description = "Personal finance management system via WhatsApp using multi-agent AI architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.11",
    "mistralai>=2.10.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.9",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
